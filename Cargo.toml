[package]
name = "smith-next"
version = "0.1.0"
edition = "2021"
publish = false
[features]
synthetic-profile = []
[dependencies]
sha2 = "0.11"
base64 = "0.22"
smith-platform = { path = "crates/smith-platform" }
smith-acceleration = { path = "crates/smith-acceleration" }
smith-tool-effects = { path = "crates/smith-tool-effects" }
smith-profile-storage = { path = "crates/smith-profile-storage" }
smith-agent-core = { path = "crates/smith-agent-core", default-features = false }
smith-media = { path = "crates/smith-media" }
tower = { version = "0.5", features = ["util"] }
libc = "0.2"
smith-managed-runtime = { path = "crates/smith-managed-runtime" }
smith-mlx-runtime = { path = "crates/smith-mlx-runtime" }
smith-local-catalog = { path = "crates/smith-local-catalog" }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
futures-util = "0.3"
async-stream = "0.3"
uuid = { version = "1", features = ["v4"] }
url = "2"
directories = "6"
fs2 = "0.4"
[dev-dependencies]
smith-tool-effects = { path = "crates/smith-tool-effects", features = ["fixtures"] }
tempfile = "3"

# Model/runtime custody rehashes every selected byte. Optimize the SHA-256
# implementation even for local development builds; never skip that validation.
[profile.dev.package.sha2]
opt-level = 3
