[package]
name = "smith-mlx-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
smith-managed-runtime = { path = "../smith-managed-runtime" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace]
