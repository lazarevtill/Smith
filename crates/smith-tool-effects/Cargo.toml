[package]
name = "smith-tool-effects"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[features]
fixtures = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
futures-util = "0.3"

[workspace]

[[bin]]
name = "smith-effects-fixture"
path = "tests/fixtures/command.rs"
required-features = ["fixtures"]
