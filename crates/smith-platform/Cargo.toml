[package]
name = "smith-platform"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Explicitly selected target, fresh snapshot and single-action platform adapters"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
smith-agent-core = { path = "../smith-agent-core", default-features = false }

[workspace]
