name: Native compile gates (hardware later)
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - ".github/release.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux, component: backend, toolchain: '1.89.0'}
          - {runner: windows-2022, platform: windows, component: backend, toolchain: '1.89.0'}
          - {runner: ubuntu-24.04, platform: linux, component: native, toolchain: '1.92.0'}
          - {runner: windows-2022, platform: windows, component: native, toolchain: '1.92.0'}
          - {runner: macos-15, platform: macos-arm64, component: backend, toolchain: '1.89.0'}
          - {runner: macos-15, platform: macos-arm64, component: native, toolchain: '1.92.0'}
          - {runner: macos-15-intel, platform: macos-intel, component: backend, toolchain: '1.89.0'}
          - {runner: macos-15-intel, platform: macos-intel, component: native, toolchain: '1.92.0'}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TERM_COLOR: never
    steps:
      - name: Preserve exact reviewed line endings in this disposable runner
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout Smith public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: smith-next
          persist-credentials: false
          submodules: false
      - name: Verify reviewed vendored UI snapshot (no private source checkout)
        shell: bash
        working-directory: smith-next
        run: python ci/verify_ui_snapshot.py
      - name: Install exact compiler into disposable runner
        shell: bash
        env:
          BUILD_TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup toolchain install "$BUILD_TOOLCHAIN" --profile minimal
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Bind existing x64 MSVC OpenSSL (SQLCipher; no crypto feature substitution)
        if: runner.os == 'Windows' && matrix.component == 'backend'
        shell: pwsh
        run: |
          $cryptoRoot = Join-Path $env:ProgramFiles 'OpenSSL'
          $cryptoLib = Join-Path $cryptoRoot 'lib/VC/x64/MD'
          $cryptoInclude = Join-Path $cryptoRoot 'include'
          if (!(Test-Path (Join-Path $cryptoLib 'libcrypto.lib')) -or !(Test-Path (Join-Path $cryptoInclude 'openssl/crypto.h'))) {
            throw 'Runner OpenSSL layout changed: inspect and explicitly update the reviewed x64 MSVC binding.'
          }
          "OPENSSL_LIB_DIR=$cryptoLib" >> $env:GITHUB_ENV
          "OPENSSL_INCLUDE_DIR=$cryptoInclude" >> $env:GITHUB_ENV
      - name: Bind macOS SQLCipher build dependency
        if: runner.os == 'macOS' && matrix.component == 'backend'
        shell: bash
        run: |
          brew install openssl@3 pkg-config
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Verify every target's UI policy and reviewed markup (no models or host actions)
        if: matrix.component == 'native'
        shell: bash
        working-directory: smith-next
        env:
          BUILD_TOOLCHAIN: ${{ matrix.toolchain }}
        run: python ci/check_platform_ui.py --toolchain "$BUILD_TOOLCHAIN" --ui-dir vendor/smith-ui
      - name: Compile normal component (no model/runtime/desktop launch)
        shell: bash
        working-directory: smith-next
        env:
          BUILD_COMPONENT: ${{ matrix.component }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: python ci/build_native.py --component "$BUILD_COMPONENT" --platform "$BUILD_PLATFORM" --ui-dir vendor/smith-ui
      # Deliberately no upload-artifact, cache upload, release, push, model execution or desktop launch.
      # A failed build remains a failed job; no continue-on-error or mock features.
